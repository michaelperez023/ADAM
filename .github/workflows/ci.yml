name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Lint
        run: uvx ruff@0.17.5 check

      - name: Check formatting
        run: uvx ruff@0.17.5 format --check

  test:
    name: test (Python ${{ matrix.python }}, PyTorch ${{ matrix.pytorch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            pytorch: latest
            packages: torch torchvision
          # The oldest supported versions. PyTorch 2.2.2 is also the last release for
          # Intel Macs, and it was built against NumPy 1.x.
          - python: "3.10"
            pytorch: "2.2.2"
            packages: torch==2.2.2 torchvision==0.17.2 numpy<2
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true

      - name: Install CPU-only PyTorch
        env:
          PACKAGES: ${{ matrix.packages }}
        # $PACKAGES is unquoted on purpose: it holds several requirements.
        run: uv pip install $PACKAGES --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package
        run: uv pip install -e ".[dev]"

      - name: Test
        run: python -m pytest
